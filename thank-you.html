<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Thank You | Heidi Bloom</title>
  <link rel="stylesheet" href="/styles.css">
</head>

<body class="theme-midnight">

  <main class="thank-you-page">
    <div class="thank-you-card">
      <p class="eyebrow">HEIDI BLOOM</p>

      <h1>Thank you.</h1>

      <p>
        Your inquiry has been received.
        I'll be in touch as soon as possible.
      </p>

      <a class="cta" href="/">Return to Heidi Bloom</a>
    </div>
  </main>

  <script>
    (async () => {
      try {
        const response = await fetch(
          'https://raw.githubusercontent.com/Heidibloom/heidibloom-website/main/content/site.json',
          { cache: 'no-store' }
        );

        if (!response.ok) return;

        const site = await response.json();

        document.body.className =
          'theme-' + (site.theme || 'midnight');

        if (
          site.useCustomAccent === true &&
          site.customAccent
        ) {
          document.body.style.setProperty(
            '--accent',
            site.customAccent
          );
        }

        const brand =
          document.querySelector('.eyebrow');

        if (brand && site.siteName) {
          brand.textContent =
            site.siteName.toUpperCase();
        }
      } catch (error) {
        console.error(
          'Unable to load website theme:',
          error
        );
      }
    })();
  </script>

</body>
</html>
