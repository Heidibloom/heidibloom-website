<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Heidi Bloom</title>
  <link rel="stylesheet" href="/styles.css">
</head>

<body>

<header class="hero">
  <nav>
    <div class="brand" id="brand">Heidi Bloom</div>

    <button
      id="menuButton"
      class="menu-button"
      type="button"
      aria-label="Open menu"
      aria-expanded="false"
      aria-controls="siteMenu">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </nav>

  <div id="menuBackdrop" class="menu-backdrop"></div>

  <aside id="siteMenu" class="site-menu" aria-hidden="true">
    <div class="menu-header">
      <span class="menu-title">Heidi Bloom</span>
      <button id="menuClose" class="menu-close" type="button" aria-label="Close menu">×</button>
    </div>

    <div id="menuLinks" class="menu-links"></div>
  </aside>

  <div class="hero-grid">
    <div>
      <p class="eyebrow">HEIDI BLOOM</p>
      <h1 id="tagline">Private, polished, and effortlessly personal.</h1>
      <a id="exploreButton" class="cta" href="#about">Explore</a>
    </div>

    <img id="heroImage" src="/uploads/hero-placeholder.svg" alt="Heidi Bloom">
  </div>
</header>

<main>

  <section id="about" class="section optional-section">
    <p class="eyebrow">ABOUT</p>
    <h2>About Heidi</h2>
    <p id="aboutText"></p>
  </section>

  <section id="services" class="section optional-section">
    <p class="eyebrow">SERVICES</p>
    <h2>Services &amp; Rates</h2>
    <div id="servicesList" class="services-list"></div>
  </section>

  <section id="restrictions" class="section optional-section">
    <p class="eyebrow">BOUNDARIES</p>
    <h2>Restrictions</h2>
    <div id="restrictionsList" class="restrictions-list"></div>
  </section>

  <section id="socials" class="section optional-section">
    <p class="eyebrow">CONNECT</p>
    <h2>Socials</h2>
    <div id="socialLinks" class="social-links"></div>
  </section>

  <section id="gallerySection" class="section optional-section">
    <div class="section-head">
      <div>
        <p class="eyebrow">GALLERY</p>
        <h2>Selected moments</h2>
      </div>
    </div>

    <div id="gallery" class="gallery"></div>
  </section>

  <section id="testimonialsSection" class="section testimonials optional-section">
    <p class="eyebrow">TESTIMONIALS</p>
    <h2>Kind words</h2>

    <div class="testimonial-wrap">
      <button id="prevT" type="button" aria-label="Previous testimonial">‹</button>
      <div id="testimonial"></div>
      <button id="nextT" type="button" aria-label="Next testimonial">›</button>
    </div>
  </section>

  <section id="inquiry" class="section inquiry optional-section">
    <p class="eyebrow">CONTACT</p>
    <h2 id="inquiryHeading">Private Inquiry</h2>
    <p id="inquiryNote"></p>

    <form
      name="inquiry"
      method="POST"
      data-netlify="true"
      netlify-honeypot="bot-field">

      <input type="hidden" name="form-name" value="inquiry">

      <p class="hidden">
        <label>
          Don’t fill this out:
          <input name="bot-field">
        </label>
      </p>

      <div class="form-grid">
        <label>
          Name
          <input name="name" required>
        </label>

        <label>
          Email
          <input name="email" type="email" required>
        </label>

        <label>
          Preferred date
          <input name="preferred-date" type="date">
        </label>

        <label>
          Preferred timing
          <input name="timing">
        </label>
      </div>

      <label>
        Message
        <textarea name="message" rows="6" required></textarea>
      </label>

      <button class="cta" type="submit">Send inquiry</button>
    </form>
  </section>

</main>

<footer>
  <span>© <span id="year"></span> Heidi Bloom</span>
  <a href="/privacy.html">Privacy</a>
</footer>

<script src="/site.js"></script>
</body>
</html>
